<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — All Expenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4" style="max-width: 880px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>
        <span class="eyebrow">Full history</span>
        <h1 class="h4 mb-0">All Expenses</h1>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="./budget.html">← Back to Budget</a>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4" id="categoryFilters"></div>

    <div class="card mb-3">
      <div class="card-body text-center py-3">
        <span class="text-secondary-emphasis small">Showing total</span>
        <div class="font-mono fs-4" id="filteredTotal">₱0.00</div>
      </div>
    </div>

    <div id="expenseList" class="d-flex flex-column gap-2"></div>
  </main>

  <!-- Edit expense modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 mb-0">Edit expense</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="editError"></div>
          <input type="hidden" id="editId" />
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="editAmount" class="form-label small text-secondary-emphasis">Amount</label>
              <input type="number" id="editAmount" class="form-control" min="0.01" step="0.01" required />
            </div>
            <div class="col-6">
              <label for="editDate" class="form-label small text-secondary-emphasis">Date</label>
              <input type="date" id="editDate" class="form-control" required />
            </div>
          </div>
          <div class="mb-3">
            <label for="editCategory" class="form-label small text-secondary-emphasis">Category</label>
            <select id="editCategory" class="form-select">
              <option value="Food">🍔 Food</option>
              <option value="Transportation">🚗 Transportation</option>
              <option value="Bills">🧾 Bills</option>
              <option value="Shopping">🛍️ Shopping</option>
              <option value="Entertainment">🎮 Entertainment</option>
              <option value="Health">❤️ Health</option>
              <option value="Education">📚 Education</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
          <div class="mb-1">
            <label for="editDescription" class="form-label small text-secondary-emphasis">Description (optional)</label>
            <input type="text" id="editDescription" class="form-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveEditBtn">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/expenses.js"></script>
</body>
</html>
