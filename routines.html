<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — My Routine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4" style="max-width: 880px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>
        <span class="eyebrow">Your recurring plan</span>
        <h1 class="h4 mb-0">My Routine</h1>
      </div>
      <button class="btn btn-primary btn-sm" id="addRoutineBtn">+ Add time block</button>
    </div>

    <p class="text-secondary-emphasis small mb-4">These are the times you're committing to every day. Your daily dashboard checks each one off against this list.</p>

    <div id="routineList" class="d-flex flex-column gap-2"></div>

    <div id="emptyState" class="text-center border border-secondary-subtle rounded-4 p-5 d-none">
      <p class="text-secondary-emphasis mb-3">No routine yet. Add your first time block — e.g. 5:00 AM, "Wake up".</p>
      <button class="btn btn-primary" id="emptyAddBtn">+ Add time block</button>
    </div>
  </main>

  <!-- Add / edit modal -->
  <div class="modal fade" id="routineModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 mb-0" id="modalTitle">Add time block</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="modalError"></div>
          <form id="routineForm">
            <input type="hidden" id="routineId" />
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label for="rTime" class="form-label small text-secondary-emphasis">Time</label>
                <input type="time" id="rTime" class="form-control" required />
              </div>
              <div class="col-6">
                <label for="rDuration" class="form-label small text-secondary-emphasis">Duration (min)</label>
                <input type="number" id="rDuration" class="form-control" min="5" step="5" value="30" required />
              </div>
            </div>
            <div class="mb-3">
              <label for="rTitle" class="form-label small text-secondary-emphasis">Title</label>
              <input type="text" id="rTitle" class="form-control" placeholder="e.g. Warm up" required />
            </div>
            <div class="mb-1">
              <label for="rDesc" class="form-label small text-secondary-emphasis">Notes (optional)</label>
              <textarea id="rDesc" class="form-control" rows="3" placeholder="Any details for yourself"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" form="routineForm" class="btn btn-primary" id="modalSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/routines.js"></script>
</body>
</html>
