<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="page" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <p style="color:var(--text-muted);font-family:var(--font-mono);font-size:0.85rem;">Loading Anchor…</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { sb } from "./js/supabaseClient.js";
    const { data } = await sb.auth.getSession();
    window.location.replace(data.session ? "./app.html" : "./login.html");
  </script>
</body>
