<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4" style="max-width: 880px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>
        <span class="eyebrow">Save up for it</span>
        <h1 class="h4 mb-0">Wishlist</h1>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="./budget.html">← Back to Budget</a>
        <button class="btn btn-primary btn-sm" id="addItemBtn">+ Add item</button>
      </div>
    </div>

    <p class="text-secondary-emphasis small mb-3">Short-term wants, long-term goals — track what you're saving toward and how close you are.</p>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div class="d-flex flex-wrap gap-2" id="termFilters"></div>
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" role="switch" id="showAchievedToggle">
        <label class="form-check-label small text-secondary-emphasis" for="showAchievedToggle">Show achieved</label>
      </div>
    </div>

    <div id="wishlistItems" class="d-flex flex-column gap-3"></div>
    <div id="emptyState" class="text-center border border-secondary-subtle rounded-4 p-5 d-none">
      <p class="text-secondary-emphasis mb-3">Nothing on your wishlist yet. Add something you're saving up for — big or small.</p>
      <button class="btn btn-primary" id="emptyAddBtn">+ Add item</button>
    </div>
  </main>

  <!-- Add / edit item modal -->
  <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 mb-0" id="itemModalTitle">Add wishlist item</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="itemError"></div>
          <input type="hidden" id="itemId" />
          <div class="mb-3">
            <label for="itemTitle" class="form-label small text-secondary-emphasis">What do you want?</label>
            <input type="text" id="itemTitle" class="form-control" placeholder="e.g. New laptop" required />
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="itemCost" class="form-label small text-secondary-emphasis">Estimated cost</label>
              <input type="number" id="itemCost" class="form-control" min="0.01" step="0.01" placeholder="0.00" required />
            </div>
            <div class="col-6">
              <label for="itemSaved" class="form-label small text-secondary-emphasis">Already saved</label>
              <input type="number" id="itemSaved" class="form-control" min="0" step="0.01" value="0" />
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="itemTerm" class="form-label small text-secondary-emphasis">Term</label>
              <select id="itemTerm" class="form-select">
                <option value="short">Short-term</option>
                <option value="long">Long-term</option>
              </select>
            </div>
            <div class="col-6">
              <label for="itemPriority" class="form-label small text-secondary-emphasis">Priority</label>
              <select id="itemPriority" class="form-select">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="itemCategory" class="form-label small text-secondary-emphasis">Category (used if you later record this as an expense)</label>
            <select id="itemCategory" class="form-select">
              <option value="Food">🍔 Food</option>
              <option value="Transportation">🚗 Transportation</option>
              <option value="Bills">🧾 Bills</option>
              <option value="Shopping" selected>🛍️ Shopping</option>
              <option value="Entertainment">🎮 Entertainment</option>
              <option value="Health">❤️ Health</option>
              <option value="Education">📚 Education</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
          <div class="mb-1">
            <label for="itemNotes" class="form-label small text-secondary-emphasis">Notes (optional)</label>
            <textarea id="itemNotes" class="form-control" rows="2" placeholder="Why this, or where to get it"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveItemBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add savings modal -->
  <div class="modal fade" id="savingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 mb-0">Add savings</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="savingsError"></div>
          <input type="hidden" id="savingsItemId" />
          <p class="text-secondary-emphasis small mb-3" id="savingsContext"></p>
          <div class="mb-1">
            <label for="savingsAmount" class="form-label small text-secondary-emphasis">Amount to add</label>
            <input type="number" id="savingsAmount" class="form-control" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" id="saveSavingsBtn">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mark achieved modal -->
  <div class="modal fade" id="achieveModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 mb-0">Mark as achieved</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="achieveError"></div>
          <input type="hidden" id="achieveItemId" />
          <p class="text-secondary-emphasis small mb-3" id="achieveContext"></p>

          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="achieveRecordExpense">
            <label class="form-check-label small" for="achieveRecordExpense">Also record this as an expense and deduct it from my budget</label>
          </div>

          <div id="achieveExpenseFields" class="d-none">
            <div class="row g-3 mb-1">
              <div class="col-6">
                <label for="achieveAmount" class="form-label small text-secondary-emphasis">Amount spent</label>
                <input type="number" id="achieveAmount" class="form-control" min="0.01" step="0.01" />
              </div>
              <div class="col-6">
                <label for="achieveDate" class="form-label small text-secondary-emphasis">Date</label>
                <input type="date" id="achieveDate" class="form-control" />
              </div>
            </div>
            <div class="mb-1 mt-3">
              <label for="achieveCategory" class="form-label small text-secondary-emphasis">Category</label>
              <select id="achieveCategory" class="form-select">
                <option value="Food">🍔 Food</option>
                <option value="Transportation">🚗 Transportation</option>
                <option value="Bills">🧾 Bills</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Entertainment">🎮 Entertainment</option>
                <option value="Health">❤️ Health</option>
                <option value="Education">📚 Education</option>
                <option value="Other">📦 Other</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="confirmAchieveBtn">Mark achieved</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/wishlist.js"></script>
</body>
</html>
