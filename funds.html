<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Funds Added</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4" style="max-width: 880px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>
        <span class="eyebrow">Every top-up</span>
        <h1 class="h4 mb-0">Funds Added</h1>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="./budget.html">← Back to Budget</a>
    </div>

    <div class="card mb-3">
      <div class="card-body text-center py-3">
        <span class="text-secondary-emphasis small">Total added</span>
        <div class="font-mono fs-4 text-teal" id="fundsTotal">₱0.00</div>
      </div>
    </div>

    <div id="fundsList" class="d-flex flex-column gap-2"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/funds.js"></script>
</body>
</html>
