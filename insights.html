<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4" style="max-width: 880px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>
        <span class="eyebrow">Patterns in your spending</span>
        <h1 class="h4 mb-0">Insights</h1>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="./budget.html">← Back to Budget</a>
    </div>

    <p class="text-secondary-emphasis small mb-4">Generated from your own expense history — rule-based, runs in your browser, no external AI call.</p>

    <div class="card mb-4">
      <div class="card-body">
        <ul class="list-unstyled d-flex flex-column gap-2 mb-0" id="insightsList"></ul>
      </div>
    </div>

    <h2 class="h6 mb-3">Analytics</h2>
    <div class="row g-3">
      <div class="col-md-7">
        <div class="card h-100">
          <div class="card-body">
            <h3 class="h6 mb-1">Spending by month</h3>
            <p class="text-secondary-emphasis small mb-3">Last 6 months.</p>
            <div style="position: relative; height: 240px;">
              <canvas id="monthlyChart"></canvas>
            </div>
            <p class="text-secondary-emphasis small mb-0 mt-2 d-none" id="noMonthlyData">No expenses yet.</p>
          </div>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card h-100">
          <div class="card-body">
            <h3 class="h6 mb-1">Spending by category</h3>
            <p class="text-secondary-emphasis small mb-3">All time.</p>
            <div style="position: relative; height: 240px;">
              <canvas id="categoryAnalyticsChart"></canvas>
            </div>
            <p class="text-secondary-emphasis small mb-0 mt-2 d-none" id="noCategoryAnalyticsData">No expenses yet.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/insights.js"></script>
</body>
</html>
