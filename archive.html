<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container py-4" style="max-width: 880px;">
    <div class="mb-1">
      <span class="eyebrow">Your daily notes</span>
      <h1 class="h4 mb-0">Archive</h1>
    </div>
    <p class="text-secondary-emphasis small mb-4">Every end-of-day reflection you've saved, laid out by month. Days with a note are marked — click one to read it.</p>

    <div class="card mb-4">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-3 gap-3 flex-wrap">
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary" id="archPrevMonth" aria-label="Previous month">‹</button>
            <button class="btn btn-sm btn-outline-secondary" id="archTodayBtn">Today</button>
          </div>
          <h2 class="h6 mb-0 font-mono" id="archMonthLabel">—</h2>
          <button class="btn btn-sm btn-outline-secondary" id="archNextMonth" aria-label="Next month">›</button>
        </div>
        <div class="arch-grid" id="archiveGrid"></div>
      </div>
    </div>
  </main>

  <!-- Day detail modal -->
  <div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5 mb-0" id="archDetailDate">—</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="archDetailBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/archive.js"></script>
</body>
</html>
