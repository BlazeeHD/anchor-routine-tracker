<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body>
  <div class="container-fluid vh-100 p-0">
    <div class="row g-0 h-100">
      <!-- Brand panel -->
      <div class="col-lg-6 auth-brand d-flex flex-column justify-content-between p-4 p-lg-5 border-end border-secondary-subtle">
        <span class="navbar-brand fs-5 fw-semibold d-flex align-items-center gap-2">
          <span class="brand-dot"></span> Anchor
        </span>

        <div class="my-4 my-lg-0">
          <div class="auth-rail-track d-flex flex-column gap-4">
            <div class="auth-rail-item is-done">05:00<strong>Wake up</strong></div>
            <div class="auth-rail-item is-done">05:30<strong>Warm up</strong></div>
            <div class="auth-rail-item">06:00<strong>Bathe &amp; eat</strong></div>
            <div class="auth-rail-item">06:30<strong>Check emails</strong></div>
          </div>
        </div>

        <p class="text-secondary-emphasis small mb-0" style="max-width: 34ch;">
          Plan every hour of your day, mark what actually happened, and see the time you kept versus the time you lost.
        </p>
      </div>

      <!-- Auth form -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center p-4">
        <div class="w-100" style="max-width: 380px;">
          <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
            <li class="nav-item flex-fill text-center" role="presentation">
              <button class="nav-link active w-100" id="tabSignIn" data-bs-toggle="tab" data-bs-target="#paneSignIn" type="button" role="tab">Sign in</button>
            </li>
            <li class="nav-item flex-fill text-center" role="presentation">
              <button class="nav-link w-100" id="tabSignUp" data-bs-toggle="tab" data-bs-target="#paneSignUp" type="button" role="tab">Create account</button>
            </li>
          </ul>

          <div id="formMessage"></div>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="paneSignIn" role="tabpanel">
              <form id="signInForm">
                <div class="mb-3">
                  <label for="siEmail" class="form-label small text-secondary-emphasis">Email</label>
                  <input id="siEmail" type="email" class="form-control" autocomplete="email" required />
                </div>
                <div class="mb-3">
                  <label for="siPassword" class="form-label small text-secondary-emphasis">Password</label>
                  <input id="siPassword" type="password" class="form-control" autocomplete="current-password" required />
                </div>
                <button class="btn btn-primary w-100" type="submit" id="siSubmit">Sign in</button>
              </form>
            </div>

            <div class="tab-pane fade" id="paneSignUp" role="tabpanel">
              <form id="signUpForm">
                <div class="mb-3">
                  <label for="suEmail" class="form-label small text-secondary-emphasis">Email</label>
                  <input id="suEmail" type="email" class="form-control" autocomplete="email" required />
                </div>
                <div class="mb-1">
                  <label for="suPassword" class="form-label small text-secondary-emphasis">Password</label>
                  <input id="suPassword" type="password" class="form-control" autocomplete="new-password" minlength="6" required />
                </div>
                <div class="form-text mb-3">At least 6 characters.</div>
                <button class="btn btn-primary w-100" type="submit" id="suSubmit">Create account</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
